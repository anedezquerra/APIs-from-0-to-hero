# Northwind Robotics Orders API v2 -- compliant reference spec (ch20 style rules)
openapi: 3.1.0
info:
  title: Northwind Robotics Orders API
  version: 2.1.0
  description: Order placement and tracking for the synthetic Northwind Robotics universe.
  contact:
    name: Northwind Robotics API Platform (fictional)
    email: api-platform@example.invalid
  license:
    name: Proprietary (synthetic teaching material)
servers:
  - url: https://api.northwind-robotics.example.invalid/v2
    description: Production (synthetic)
tags:
  - name: orders
    description: Create and track orders.
paths:
  /orders:
    post:
      operationId: createOrder
      summary: Create an order
      description: Creates an order. Idempotent via the Idempotency-Key header (ch10).
      tags: [orders]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Client-supplied idempotency key for safe retries.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderCreate"
      responses:
        "201":
          description: Order created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          description: Validation failure.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: Idempotency-key conflict with a different payload.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    get:
      operationId: listOrders
      summary: List orders
      description: Returns a paginated list of orders, newest first.
      tags: [orders]
      parameters:
        - name: customer_id
          in: query
          description: Filter by customer.
          schema:
            type: string
        - name: status
          in: query
          description: Filter by lifecycle status.
          schema:
            type: string
            enum: [pending, processing, shipped, delivered, cancelled, refunded]
        - name: cursor
          in: query
          description: Opaque pagination cursor.
          schema:
            type: string
        - name: limit
          in: query
          description: Page size (default 50, max 200).
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: A page of orders.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Order"
                  next_cursor:
                    type: string
                    nullable: true
        "429":
          description: Rate limit exceeded.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /orders/{order_id}:
    get:
      operationId: getOrder
      summary: Get one order
      description: Returns a single order including its line items.
      tags: [orders]
      parameters:
        - name: order_id
          in: path
          required: true
          description: Order identifier (e.g. O-100042).
          schema:
            type: string
            pattern: '^O-\d{6}$'
      responses:
        "200":
          description: The requested order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: Order not found.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    OrderLine:
      type: object
      required: [line_no, part_id, qty, unit_price_cents]
      properties:
        line_no:
          type: integer
          minimum: 1
        part_id:
          type: string
        qty:
          type: integer
          minimum: 1
        unit_price_cents:
          type: integer
          minimum: 0
    OrderCreate:
      type: object
      required: [customer_id, currency, lines]
      properties:
        customer_id:
          type: string
        currency:
          type: string
          enum: [USD, EUR, GBP, JPY]
        lines:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/OrderLine"
    Order:
      type: object
      required: [order_id, customer_id, status, order_ts, total_cents, currency, region, lines]
      properties:
        order_id:
          type: string
        customer_id:
          type: string
        status:
          type: string
          enum: [pending, processing, shipped, delivered, cancelled, refunded]
        order_ts:
          type: string
          format: date-time
        total_cents:
          type: integer
          minimum: 0
        currency:
          type: string
        region:
          type: string
          enum: [NA, EU, APAC, LATAM]
        lines:
          type: array
          items:
            $ref: "#/components/schemas/OrderLine"
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
security:
  - bearerAuth: []
